<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Munin Assistant for Docs</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="topbar">
    <button id="collapseBtn" class="brand-mark" type="button" disabled><img id="brandLogo" src="icons/icon48-dark.png" alt="Munin" width="20" height="20"></button>
    <div class="title-wrap">
      <div id="docTitle" class="doc-title" title="">Document</div>
      <div id="docStatus" class="doc-status"></div>
    </div>
    <button id="chatSwitchBtn" class="chat-switch" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="chatMenu" title="Switch chat">
      <span id="chatSwitchTitle" class="chat-switch-title">New chat</span>
      <span class="chat-switch-caret" aria-hidden="true">▾</span>
    </button>
    <button id="newChatBtn" class="icon-btn" title="New chat" aria-label="New chat">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
    <button id="instructionsBtn" class="icon-btn" title="Document instructions" aria-label="Document instructions">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
      <span id="instructionsDot" class="badge-dot hidden" aria-hidden="true"></span>
    </button>
    <button id="themeBtn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM1 11h3v2H1v-2zm19 0h3v2h-3v-2zM4.22 5.64l1.42-1.42 2.12 2.12-1.42 1.42-2.12-2.12zm12.02 12.02 1.42-1.42 2.12 2.12-1.42 1.42-2.12-2.12zM18.36 4.22l1.42 1.42-2.12 2.12-1.42-1.42 2.12-2.12zM6.34 16.24l1.42 1.42-2.12 2.12-1.42-1.42 2.12-2.12z"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12.3 2a10 10 0 1 0 9.7 12.4A8 8 0 0 1 12.3 2z"/></svg>
    </button>
    <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54A.48.48 0 0 0 13.92 2h-3.84c-.24 0-.44.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.73 8.47a.48.48 0 0 0 .12.61l2.03 1.58c-.05.3-.08.63-.08.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.48.48 0 0 0-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/></svg>
    </button>
  </header>

  <section id="settings" class="settings hidden" aria-label="Settings">
    <h2>Settings</h2>
    <label>Provider
      <select id="provider">
        <option value="munin">Munin</option>
        <option value="openai">OpenAI (ChatGPT)</option>
        <option value="anthropic">Anthropic (Claude)</option>
      </select>
    </label>
    <label><span id="apiKeyLabel">Munin API key</span>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="API key">
    </label>
    <p id="keyWarn" class="hint warn hidden"></p>
    <div class="model-row">
      <label>Model
        <select id="modelSelect"></select>
      </label>
      <button id="checkModels" class="btn" type="button" title="Ask the API which models are available">Check models</button>
    </div>
    <p id="modelStatus" class="hint hidden"></p>
    <div class="google-row">
      <span id="googleStatus" class="google-label" title="Not signed in">Google account</span>
      <button id="googleConnect" class="btn small" type="button" title="Sign in to read and edit the document through the Google Docs API">Sign in with Google</button>
      <button id="googleSwitch" class="btn small hidden" type="button" title="Pick another Google account">Switch account</button>
      <button id="googleDisconnect" class="btn small hidden" type="button" title="Forget the Google sign-in; the document is read through the export again">Sign out</button>
    </div>
    <p id="googleHint" class="hint hidden"></p>
    <p id="settingsVersion" class="settings-version"></p>
  </section>

  <section id="instructions" class="settings hidden" aria-label="Document instructions">
    <h2>Document instructions</h2>
    <textarea id="instructionsText" class="instructions-text" rows="8" maxlength="8000" spellcheck="true" placeholder="For example: British English. Target journal: Biophysical Journal. Keep the term &quot;lipid raft&quot;. Do not change the Methods section."></textarea>
    <p id="instructionsCount" class="hint">0 / 8,000 characters</p>
    <div class="settings-actions">
      <button id="closeInstructions" class="btn">Close</button>
    </div>
    <div id="paperCard" class="paper-card">
      <h2>Paper card</h2>
      <p id="paperCardHint" class="hint"></p>
      <p id="paperCardStale" class="hint warn hidden">The document changed since this card was built.</p>
      <div id="paperCardFields" class="hidden"></div>
      <div class="settings-actions">
        <button id="paperCardBuild" class="btn small" type="button" title="One request on the document alone; you check the result before it is used">Build paper card</button>
        <button id="paperCardSave" class="btn small primary hidden" type="button" title="Send this card with every message">Save</button>
        <button id="paperCardDiscard" class="btn small hidden" type="button" title="Drop the unsaved card or edits">Discard</button>
      </div>
    </div>
  </section>

  <main id="chat" class="chat" aria-live="polite"></main>

  <div id="splitter" class="splitter" role="separator" aria-orientation="horizontal" aria-label="Resize the input area" title="Drag to resize the input area" tabindex="0"></div>

  <section id="composer" class="composer">
    <details id="selBox" class="sel-box">
      <summary>
        <span class="sel-label">Selected:</span>
        <span id="selPreview" class="sel-preview">—</span>
      </summary>
      <pre id="selFull" class="sel-full"></pre>
    </details>
    <div id="trimNote" class="trim-note hidden"></div>
    <div id="queueRow" class="queue-row hidden" role="status">
      <span class="queue-label">Queued:</span>
      <button id="queueText" class="queue-text" type="button" title=""></button>
      <button id="queueEdit" class="btn small ghost" type="button" title="Put the queued message back into the input box">Edit</button>
      <button id="queueDiscard" class="btn small ghost" type="button" title="Discard the queued message" aria-label="Discard the queued message">✕</button>
    </div>
    <div class="input-row">
      <textarea id="input" rows="3" aria-autocomplete="list" aria-controls="cmdPopup" placeholder="Ask anything — type / to force a mode (Enter to send, Shift+Enter for a new line)"></textarea>
    </div>
    <div class="input-bar">
      <button id="cmdBtn" class="cmd-btn" type="button" title="Commands" aria-label="Commands" aria-haspopup="listbox" aria-controls="cmdPopup">/</button>
      <button id="modeCycle" class="mode-cycle" type="button" data-mode="manual" aria-label="Mode: Manual, click to choose" aria-haspopup="menu" aria-expanded="false" title="Choose how the assistant works"><span class="mode-dot" aria-hidden="true"></span><span id="modeLabel" class="mode-label">Manual</span></button>
      <div id="contextGauge" class="context-gauge hidden" role="img" aria-label="Context usage">
        <span class="context-bar" aria-hidden="true"><span id="contextFill" class="context-fill"></span><span id="contextMark" class="context-mark"></span></span>
        <span id="contextText" class="context-text"></span>
      </div>
      <button id="actionBtn" class="action-btn" type="button" title="Send (Enter)" aria-label="Send (Enter)">
        <svg class="icon-send" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 4.5 5.3 11.2l1.4 1.4L11 8.3V19.5h2V8.3l4.3 4.3 1.4-1.4z"/></svg>
        <svg class="icon-stop" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>
      </button>
    </div>
  </section>

  <div id="cmdPopup" class="cmd-popup hidden" role="listbox" aria-label="Slash commands"></div>
  <div id="modeMenu" class="mode-menu hidden" role="menu" aria-label="Mode"></div>
  <div id="chatMenu" class="chat-menu hidden" role="listbox" aria-label="Chats of this document"></div>

  <!-- Classic scripts sharing one global scope; the order matters (see each file's header). -->
  <script src="src/constants.js"></script>
  <script src="src/registry.js"></script>
  <script src="src/docs-style.js"></script>
  <script src="src/text-segments.js"></script>
  <script src="src/prose-lists.js"></script>
  <script src="vendor/typograf.min.js"></script>
  <script src="src/prompts.js"></script>
  <script src="src/dom.js"></script>
  <script src="src/settings.js"></script>
  <script src="src/state.js"></script>
  <script src="src/doc-instructions.js"></script>
  <script src="src/slash.js"></script>
  <script src="src/tab-bridge.js"></script>
  <script src="src/google-auth.js"></script>
  <script src="src/docs-model.js"></script>
  <script src="src/docs-write.js"></script>
  <script src="src/docs-undo.js"></script>
  <script src="src/gate.js"></script>
  <script src="src/chats.js"></script>
  <script src="src/orb.js"></script>
  <script src="src/word-diff.js"></script>
  <script src="src/render.js"></script>
  <script src="src/request.js"></script>
  <script src="src/providers/openai.js"></script>
  <script src="src/providers/anthropic.js"></script>
  <script src="src/providers/munin.js"></script>
  <script src="src/compaction.js"></script>
  <script src="src/transport.js"></script>
  <script src="src/web-search.js"></script>
  <script src="src/tools.js"></script>
  <script src="src/docs-tables.js"></script>
  <script src="src/docs-segments.js"></script>
  <script src="src/docs-comments.js"></script>
  <script src="src/zotero.js"></script>
  <script src="src/references.js"></script>
  <script src="src/doc-history.js"></script>
  <script src="src/prose-lint.js"></script>
  <script src="src/draft.js"></script>
  <script src="src/revise.js"></script>
  <script src="src/hidden-text.js"></script>
  <script src="src/own-changes.js"></script>
  <script src="src/provenance.js"></script>
  <script src="src/action-log.js"></script>
  <script src="src/findings.js"></script>
  <script src="src/review.js"></script>
  <script src="src/paper-card.js"></script>
  <script src="src/section-scores.js"></script>
  <script src="src/followups.js"></script>
  <script src="src/selftest.js"></script>
  <script src="src/check-text.js"></script>
  <script src="src/check-refs.js"></script>
  <script src="src/check.js"></script>
  <script src="src/guidelines.js"></script>
  <script src="src/stream-render.js"></script>
  <script src="src/turn.js"></script>
  <script src="src/main.js"></script>
  <script src="src/doc-live.js"></script>
  <script src="src/dev-reload.js"></script>
</body>
</html>
